<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elena Belousova — 10 premium portfolio directions</title>
  <meta name="description" content="Ten premium portfolio directions using Elena Belousova's complete Wix image archive.">
  <link rel="stylesheet" href="shared.css">
</head>
<body class="hub">
  <main id="concepts" class="concept-list" aria-label="Portfolio mockups"></main>
  <script src="portfolio-data.js"></script>
  <script>
    const concepts = [
      ['concept-1-aperture.html', 2],
      ['concept-2-index.html', 9],
      ['concept-3-chapters.html', 19],
      ['concept-4-contact-sheet.html', 31],
      ['concept-5-afterimage.html', 47],
      ['concept-6-sequence.html', 62],
      ['concept-7-cabinet.html', 78],
      ['concept-8-editions.html', 96],
      ['concept-9-four-rooms.html', 119],
      ['concept-10-field-notes.html', 137],
    ];
    const images = PORTFOLIO_DATA.sections.flatMap((section) => section.images);
    document.querySelector('#concepts').innerHTML = concepts.map(([href, imageIndex], index) => {
      const image = images[imageIndex % images.length];
      const number = String(index + 1).padStart(2, '0');
      return `<a class="concept-card" href="${href}" aria-label="Mockup ${index + 1}" data-reveal>
        <span class="concept-card__number" aria-hidden="true">${number}</span>
        <img src="${image.thumb}" alt="" loading="${index < 4 ? 'eager' : 'lazy'}" decoding="async">
      </a>`;
    }).join('');
  </script>
  <script src="shared.js"></script>
</body>
</html>
